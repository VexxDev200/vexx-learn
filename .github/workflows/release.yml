name: Release portable exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portable
        run: npm run build

      - name: Pack course updates manifest
        run: npm run pack:updates

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: release/Vexx-Learn-Portable.exe
          generate_release_notes: true
          draft: false
