# Verifies that the committed OTA manifest (release/updates/manifest.json) is SIGNED and the signature
# is valid for the public key embedded in the app (electron/ota-public-key.mjs), and that the sha256 of every
# file next to it (course JSONs, app-ui.zip; the exe only if portableSha256 is set and the exe is present)
# matches the hashes recorded in the manifest.
#
# CI does NOT build, pack or commit the OTA bundle any more, and it never holds the private key.
# Releases are signed LOCALLY:   npm run release:pack -- --sign   (see AUDIT.md, section 9: how to publish a signed release).
#
# EXPECTED TO BE RED until the first signed release (0.2.12) is committed: the manifest currently in the
# repository is unsigned, so this check fails on purpose. That is not a CI breakage - it is the gate working.
name: Verify OTA manifest signature

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  verify-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No `npm ci` needed: the check uses only Node built-ins and two files from this repo.
      - name: Manifest must be signed and valid, files must match its hashes
        run: node scripts/sign-manifest.mjs --check release/updates/manifest.json
